name: Production CI/CD Deployment

on:
  push:
    # Action ini akan berjalan HANYA saat Anda melakukan push Tag (contoh: git tag v1.0.0 lalu git push origin v1.0.0)
    tags:
      - 'v*.*.*'
  # Action ini juga bisa Anda trigger secara MANUAL lewat dashboard GitHub Actions
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: 🚚 Checkout Repository
      uses: actions/checkout@v4

    - name: 🛠️ Setup PHP Environment
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, dom, filter, gd, json
        coverage: none

    - name: 📦 Install Composer Dependencies (Vendor)
      run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev
      
    - name: 🔑 Prepare .env file for packaging
      # Ini hanya untuk CI, file aslinya di server tidak akan tertimpa
      run: |
        cp .env.example .env
        php artisan key:generate

    - name: 🌐 Connect to ZeroTier VPN
      run: |
        curl -s https://install.zerotier.com | sudo bash
        sudo zerotier-cli join ${{ secrets.ZEROTIER_NETWORK_ID }}
        
        # Wait for the connection to establish (usually takes a few seconds)
        sleep 10
        
        # Verify connection
        sudo zerotier-cli info
        sudo zerotier-cli listnetworks

    - name: 📂 Deploy & Sync Files to Server via Rsync
      uses: easingthemes/ssh-deploy@main
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
        ARGS: "-rlgoDzvc -i --delete"
        REMOTE_HOST: ${{ secrets.SERVER_HOST }}
        REMOTE_USER: ${{ secrets.SERVER_USERNAME }}
        REMOTE_PORT: ${{ secrets.SERVER_PORT }}
        SOURCE: "./"
        TARGET: ${{ secrets.SERVER_TARGET_DIR }}
        EXCLUDE: "/.git/, /.github/, /.env, /node_modules/, /tests/, /storage/framework/cache/data/, /storage/framework/sessions/, /storage/framework/views/, /storage/logs/"

    - name: 🚀 Run Post-Deploy Artisan Commands on Server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USERNAME }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT }}
        script: |
          cd ${{ secrets.SERVER_TARGET_DIR }}
          
          echo "🔒 Mengatur Permissions..."
          find storage -type f -exec chmod 664 {} \;
          find storage -type d -exec chmod 775 {} \;
          find bootstrap/cache -type f -exec chmod 664 {} \;
          find bootstrap/cache -type d -exec chmod 775 {} \;
          
          echo "🔗 Memastikan Storage Terhubung..."
          php artisan storage:link || true
          
          echo "🗄️ Menjalankan Migrasi Database..."
          # Pastikan file .env di server Anda sudah memiliki informasi database yang valid!
          php artisan migrate --force
          
          echo "⚡ Mengoptimalkan & Caching Laravel..."
          php artisan optimize:clear
          php artisan config:cache
          php artisan event:cache
          php artisan route:cache
          php artisan view:cache
          
          echo "🌐 Mempublikasikan Aset Livewire..."
          php artisan livewire:publish --assets || true
          
          echo "🚀 Mengoptimalkan Filament Panel..."
          php artisan filament:optimize || true
          
          echo "✅ Deployment Sukses untuk versi: ${{ github.ref_name }}!"
